name: Daily DB Backup

on:
  schedule:
    - cron: '0 2 * * *'  # 2am UTC every day
  workflow_dispatch:       # Also allow manual trigger from GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backup repo
        uses: actions/checkout@v4
        with:
          repository: lbagga2xs/fit2x-backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup-repo

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          mkdir -p backup-repo/backups
          pg_dump "$DIRECT_URL" \
            --no-password \
            --format=plain \
            --no-owner \
            --no-acl \
            -f "backup-repo/backups/backup-$(date +%Y-%m-%d).sql"
          echo "Backup created: backup-repo/backups/backup-$(date +%Y-%m-%d).sql"

      - name: Remove backups older than 30 days
        run: |
          find backup-repo/backups/ -name "backup-*.sql" -mtime +30 -delete

      - name: Commit and push to backup repo
        run: |
          cd backup-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "chore: db backup $(date +%Y-%m-%d)"
          git push
